<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>ТЗНК тренажер</title>
<meta name="description" content="Тренажер для підготовки до ТЗНК (ЄВІ): симуляція іспиту, тренування з поясненнями, повторення помилок.">
<style>
:root {
  --bg: #f6f7f9; --card: #ffffff; --text: #1c1f26; --muted: #6b7280; --line: #e3e6eb;
  --accent: #2f5fd8; --accent-soft: #e6ecfb; --ok: #1f8f4e; --ok-soft: #e3f5ea;
  --bad: #c8362f; --bad-soft: #fbe6e4; --warn: #b7791f; --warn-soft: #fdf3dc;
  --radius: 12px; --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12141a; --card: #1b1e27; --text: #e7e9ee; --muted: #9aa1ad; --line: #2b2f3a;
    --accent: #7b9dff; --accent-soft: #232b45; --ok: #4cc27a; --ok-soft: #1c3327;
    --bad: #ff7b72; --bad-soft: #3a2220; --warn: #e0b04f; --warn-soft: #3a3020;
    --shadow: 0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"] {
  --bg: #12141a; --card: #1b1e27; --text: #e7e9ee; --muted: #9aa1ad; --line: #2b2f3a;
  --accent: #7b9dff; --accent-soft: #232b45; --ok: #4cc27a; --ok-soft: #1c3327;
  --bad: #ff7b72; --bad-soft: #3a2220; --warn: #e0b04f; --warn-soft: #3a3020;
  --shadow: 0 1px 2px rgba(0,0,0,.4);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); }
button { font: inherit; color: inherit; cursor: pointer; }
img { max-width: 100%; height: auto; }
table { border-collapse: collapse; margin: .5em 0; }
td, th { border: 1px solid var(--line); padding: 4px 8px; }
.wrap { max-width: 1100px; margin: 0 auto; padding: 16px; }
header.top {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--card);
  position: sticky; top: 0; z-index: 5;
}
/* Phones: one compact row that scrolls away with the page. */
@media (max-width: 600px) {
  header.top { position: static; padding: 10px 16px; }
  header.top .sub { display: none; }
  header.top h1 { font-size: 16px; }
  header.top .row { flex-wrap: nowrap; gap: 6px; }
}
.menu { position: relative; }
.menu .drop { position: absolute; right: 0; top: 34px; display: none; flex-direction: column; gap: 6px; padding: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); z-index: 6; min-width: 160px; }
.menu.open .drop { display: flex; }
.menu .who { padding: 4px 6px; font-size: 12px; color: var(--muted); white-space: nowrap; }
header.top h1 { font-size: 18px; margin: 0; font-weight: 650; }
header.top .sub { color: var(--muted); font-size: 13px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; }
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.mode { display: flex; flex-direction: column; gap: 10px; }
.mode h2 { margin: 0; font-size: 18px; }
.mode p { margin: 0; color: var(--muted); font-size: 14px; flex: 1; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn {
  border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 9px 14px;
  font-weight: 550; transition: background .12s, border-color .12s;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.small { padding: 5px 10px; font-size: 14px; }
select, input[type=number] {
  font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--line);
  border-radius: 10px; padding: 8px 10px;
}
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 14px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
.stat .v { font-size: 26px; font-weight: 700; line-height: 1.1; }
.stat .l { color: var(--muted); font-size: 13px; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
h2.sec { font-size: 16px; margin: 22px 0 10px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
table.hist { width: 100%; font-size: 14px; }
table.hist td, table.hist th { border: 0; border-bottom: 1px solid var(--line); text-align: left; padding: 8px 6px; }
table.hist th { color: var(--muted); font-weight: 600; }
.tablewrap { overflow-x: auto; }
@media (max-width: 600px) {
  table.hist { font-size: 13px; }
  table.hist td, table.hist th { padding: 8px 4px; }
  table.hist .hide-sm { display: none; }
  table.hist .show-sm { display: initial; }
  table.hist th { font-size: 12px; }
}
.show-sm { display: none; }
table.hist td.kind { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; padding-top: 14px; }
.expl.review { background: var(--accent-soft); }
.expl details { margin-top: 10px; }
.expl summary { cursor: pointer; font-weight: 600; font-size: 14px; }
.expl .src { margin-top: 8px; }

/* quiz */
.qbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.qbar .timer { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 20px; padding: 4px 10px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); }
.qbar .timer.low { background: var(--bad-soft); color: var(--bad); }
.qbar .spacer { flex: 1; }
.nav { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 14px; }
.nav button {
  width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: var(--card);
  font-size: 13px; font-weight: 600; padding: 0;
}
.nav button.cur { outline: 2px solid var(--accent); outline-offset: 1px; }
.nav button.done { background: var(--accent-soft); border-color: transparent; }
.nav button.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.nav button.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.qlayout { display: grid; gap: 14px; grid-template-columns: 1fr; }
.qlayout.has-passage { grid-template-columns: 1fr; }
@media (min-width: 960px) {
  .qlayout.has-passage { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); align-items: start; }
  .passage { position: sticky; top: 70px; max-height: calc(100vh - 90px); overflow: auto; }
}
.passage { font-size: 15px; line-height: 1.6; max-height: 45vh; overflow: auto; }
@media (min-width: 960px) { .passage { max-height: calc(100vh - 90px); } }
.passage p { margin: .5em 0; }
.qhead { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 6px; }
.qhead .n { font-weight: 700; }
.qhead .tag { color: var(--muted); font-size: 13px; }
.question { font-size: 17px; }
.question p { margin: .5em 0; }
.answers { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
.ans {
  display: flex; gap: 12px; align-items: flex-start; text-align: left; width: 100%;
  border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 10px 12px;
  transition: background .12s, border-color .12s;
}
.ans:hover:not(:disabled) { border-color: var(--accent); }
.ans .k {
  flex: 0 0 28px; height: 28px; border-radius: 8px; display: grid; place-items: center;
  background: var(--bg); font-weight: 700; font-size: 14px;
}
.ans.sel { border-color: var(--accent); background: var(--accent-soft); }
.ans.sel .k { background: var(--accent); color: #fff; }
.ans.ok { border-color: var(--ok); background: var(--ok-soft); }
.ans.ok .k { background: var(--ok); color: #fff; }
.ans.bad { border-color: var(--bad); background: var(--bad-soft); }
.ans.bad .k { background: var(--bad); color: #fff; }
.ans:disabled { cursor: default; }
.expl { margin-top: 14px; padding: 14px 16px; border-radius: 10px; background: var(--warn-soft); border: 1px solid transparent; font-size: 15px; }
.expl p { margin: .5em 0; }
.expl .t { font-weight: 700; margin-bottom: 4px; }
.expl .legend { margin: 8px 0; font-size: 13px; color: var(--muted); }
.expl .legend ul { margin: 4px 0 0; padding-left: 18px; }
.verdict { font-weight: 700; margin-top: 12px; }
.verdict.ok { color: var(--ok); } .verdict.bad { color: var(--bad); }
.qactions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; justify-content: space-between; }
.hidden { display: none !important; }

/* result */
.score { display: flex; gap: 24px; flex-wrap: wrap; align-items: center; }
.score .big { font-size: 48px; font-weight: 800; line-height: 1; }
.score .scale { font-size: 22px; font-weight: 700; color: var(--accent); }
.bars { display: grid; gap: 8px; margin-top: 16px; }
.bar { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; font-size: 14px; }
.bar .track { grid-column: 1 / -1; height: 8px; border-radius: 4px; background: var(--bg); overflow: hidden; }
.bar .fill { height: 100%; background: var(--ok); }
.list { display: grid; gap: 8px; margin-top: 14px; }
.item { display: flex; gap: 10px; align-items: center; justify-content: space-between; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-size: 14px; }
.pill { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--bg); color: var(--muted); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.item.link { width: 100%; text-align: left; background: var(--card); color: inherit; font: inherit; cursor: pointer; }
.item.link:hover { border-color: var(--accent); }
.answers2 { display: flex; flex-direction: column; gap: 4px; align-items: flex-end; flex-shrink: 0; max-width: 55%; }
.answers2 .pill { white-space: normal; text-align: right; }
@media (max-width: 700px) { .item.link { flex-direction: column; align-items: flex-start; } .answers2 { align-items: flex-start; max-width: 100%; } .answers2 .pill { text-align: left; } }
footer { color: var(--muted); font-size: 13px; text-align: center; padding: 24px 16px; }
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
.modal { max-width: 440px; width: 100%; }
.acct { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; padding: 3px 8px; }
.acct img { width: 24px; height: 24px; border-radius: 50%; }
@media (max-width: 600px) { .acct .name { display: none; } }
</style>
</head>
<body>
<header class="top">
  <div>
    <h1>ТЗНК тренажер</h1>
    <div class="sub" id="subtitle">ЄВІ · 27 завдань · 33 бали · 75 хвилин</div>
  </div>
  <div class="row">
    <span class="row" id="account"></span>
    <button class="btn small" id="homeBtn">Головна</button>
  </div>
</header>

<main class="wrap" id="app">
  <div class="card">Завантаження даних…</div>
</main>

<footer>
  Завдання та пояснення: <a href="https://zno.osvita.ua/master/tznpk/" target="_blank" rel="noopener">ЗНО-онлайн (Освіта.ua)</a>.
  Формат і шкала: <a href="https://testportal.gov.ua/yedynyj-vstupnyj-ispyt-2026/" target="_blank" rel="noopener">УЦОЯО</a>.
  Прогрес зберігається лише в цьому браузері.
</footer>

<script src="data.js"></script>
<script>
'use strict';
const EXAM_MINUTES = 75;
const MAX_POINTS = 33;
// Таблиця переведення тестових балів ТЗНК у шкалу 100–200 (Порядок прийому 2026).
const SCALE = {5:100,6:104,7:108,8:112,9:116,10:120,11:125,12:130,13:135,14:139,15:143,16:147,17:151,18:153,
  19:156,20:159,21:162,22:165,23:168,24:171,25:175,26:179,27:182,28:185,29:187,30:190,31:193,32:196,33:200};
const SECTION_RANGE = { lexis: [1, 10], reading: [11, 18], logic: [19, 33] };
const STORE_KEY = 'tznk.v1';

const $ = (sel, root = document) => root.querySelector(sel);
const el = (tag, attrs = {}, ...children) => {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') node.className = v;
    else if (k === 'html') node.innerHTML = v;
    else if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined) node.setAttribute(k, v);
  }
  for (const c of children.flat()) {
    if (c === null || c === undefined || c === false) continue;
    node.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return node;
};
const fmtTime = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
const fmtDate = iso => new Date(iso).toLocaleDateString('uk-UA', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
const scaleOf = pts => pts >= 5 ? SCALE[pts] : null;
const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const keyOf = (v, n) => `${v}:${n}`;

// ---------- storage ----------
// Timestamps (inProgressAt, errorsClearedAt, resetAt, savedAt) let two devices agree on deletions when their copies are merged.
const emptyStore = () => ({ attempts: [], errors: {}, drill: {}, sessions: [], inProgress: null, inProgressAt: null, errorsClearedAt: null, resetAt: null, savedAt: null });
let store = emptyStore();
function loadStore() {
  try { const raw = localStorage.getItem(STORE_KEY); if (raw) store = Object.assign(emptyStore(), JSON.parse(raw)); } catch (e) { store = emptyStore(); }
}
function saveStore() {
  store.savedAt = new Date().toISOString();
  try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (e) { /* private mode */ }
  if (window.TZNK_SYNC) window.TZNK_SYNC.schedulePush();
}
// Hooks for sync.js (cloud sync is optional and lives in a separate module).
window.TZNK_APP = {
  getStore: () => store,
  setStore: s => { store = Object.assign(emptyStore(), s); try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (e) { /* private mode */ } },
  rerenderHome: () => home(),
  isHome: () => !document.querySelector('.qbar'),
  el: (...a) => el(...a),
};
function setInProgress(state) { store.inProgress = state; store.inProgressAt = new Date().toISOString(); }
function recordAnswer(item, variantId, correct) {
  const k = keyOf(variantId, item.n);
  const d = store.drill[k] || (store.drill[k] = { ok: 0, bad: 0 });
  if (correct) {
    d.ok++; d.lastOk = new Date().toISOString();
    if (store.errors[k]) delete store.errors[k];
  } else {
    d.bad++;
    const e = store.errors[k] || (store.errors[k] = { count: 0 });
    e.count++; e.last = new Date().toISOString();
  }
  saveStore();
}

// ---------- data ----------
let DATA = null;
const variantById = id => DATA.variants.find(v => v.id === Number(id));
const allItems = () => DATA.variants.flatMap(v => v.items.map(it => ({ item: it, variantId: v.id })));

// ---------- screens ----------
const app = $('#app');
let timerHandle = null;
function stopTimer() { if (timerHandle) { clearInterval(timerHandle); timerHandle = null; } }
function show(node) { stopTimer(); app.replaceChildren(node); window.scrollTo({ top: 0 }); }

function home() {
  const attempts = store.attempts.slice().reverse();
  const errCount = Object.keys(store.errors).length;
  const drilled = Object.values(store.drill);
  const okSum = drilled.reduce((s, d) => s + d.ok, 0), badSum = drilled.reduce((s, d) => s + d.bad, 0);
  const acc = okSum + badSum ? Math.round(100 * okSum / (okSum + badSum)) : null;
  const best = attempts.length ? Math.max(...attempts.map(a => a.score)) : null;

  const simSel = el('select', {}, ...variantOptions());
  const drillSel = el('select', {}, el('option', { value: 'all' }, 'Усі варіанти'),
    ...Object.entries(DATA.kinds).filter(([k]) => DATA.variants.some(v => v.kind === k)).map(([k, t]) => el('option', { value: 'kind:' + k }, 'Усі: ' + t)),
    ...variantOptions());
  const secSel = el('select', {}, el('option', { value: 'all' }, 'Усі блоки'),
    ...Object.entries(DATA.sections).map(([k, t]) => el('option', { value: k }, t)));
  const onlyNew = el('input', { type: 'checkbox', checked: '' });

  const resume = store.inProgress ? el('div', { class: 'card', style: 'margin-bottom:14px;border-color:var(--warn)' },
    el('div', { class: 'row', style: 'justify-content:space-between' },
      el('div', {}, el('b', {}, 'Незавершена симуляція: '), shortTitle(variantById(store.inProgress.variantId)),
        el('span', { class: 'muted small' }, ` · ${Object.keys(store.inProgress.answers).length} відповідей · залишилось ${fmtTime(store.inProgress.remaining)}`)),
      el('div', { class: 'row' },
        el('button', { class: 'btn primary small', onclick: () => startSim(store.inProgress.variantId, store.inProgress) }, 'Продовжити'),
        el('button', { class: 'btn small danger', onclick: () => { setInProgress(null); saveStore(); home(); } }, 'Скинути')))) : null;

  const node = el('div', {},
    el('div', { class: 'stats' },
      el('div', { class: 'stat' }, el('div', { class: 'v' }, attempts.length), el('div', { class: 'l' }, 'симуляцій пройдено')),
      el('div', { class: 'stat' }, el('div', { class: 'v' }, best === null ? '—' : `${best}/${MAX_POINTS}`), el('div', { class: 'l' }, best !== null && scaleOf(best) ? `найкращий · ${scaleOf(best)} балів` : 'найкращий результат')),
      el('div', { class: 'stat' }, el('div', { class: 'v' }, acc === null ? '—' : `${acc}%`), el('div', { class: 'l' }, `точність · ${okSum + badSum} відповідей`)),
      el('div', { class: 'stat' }, el('div', { class: 'v', style: errCount ? 'color:var(--bad)' : '' }, errCount), el('div', { class: 'l' }, 'помилок до повторення'))),
    resume,
    el('div', { class: 'grid' },
      el('div', { class: 'card mode' },
        el('h2', {}, 'Симуляція іспиту'),
        el('p', {}, `Повний варіант: 33 пункти, ${EXAM_MINUTES} хвилин, без підказок. Результат у тестових балах і за шкалою 100–200. Порядок відповідей як в оригіналі.`),
        el('div', { class: 'row' }, simSel, el('button', { class: 'btn primary', onclick: () => startSim(simSel.value) }, 'Почати'))),
      el('div', { class: 'card mode' },
        el('h2', {}, 'Тренажер'),
        el('p', {}, 'По одному завданню з миттєвою перевіркою. Пояснення відкривається автоматично при помилці. Варіанти відповідей перемішані.'),
        el('div', { class: 'row' }, drillSel, secSel),
        el('label', { class: 'row small muted' }, onlyNew, ' лише ще не розв’язані правильно'),
        el('div', { class: 'row' }, el('button', { class: 'btn primary', onclick: () => startDrill(drillSel.value, secSel.value, onlyNew.checked) }, 'Почати'))),
      el('div', { class: 'card mode' },
        el('h2', {}, 'Робота над помилками'),
        el('p', {}, errCount ? `${errCount} завдань, на які була неправильна відповідь. Правильна відповідь прибирає завдання зі списку.` : 'Список порожній. Помилки з симуляцій і тренажера з’являться тут.'),
        el('div', { class: 'row' },
          el('button', { class: 'btn primary', disabled: errCount ? null : '', onclick: startErrors }, 'Повторити помилки'),
          errCount ? el('button', { class: 'btn small danger', onclick: () => { if (confirm('Очистити список помилок?')) { store.errors = {}; store.errorsClearedAt = new Date().toISOString(); saveStore(); home(); } } }, 'Очистити') : null))),
    signInOffer(),
    el('h2', { class: 'sec' }, 'Варіанти'),
    el('div', { class: 'card' }, variantTable()),
    attempts.length ? el('h2', { class: 'sec' }, 'Історія симуляцій') : null,
    attempts.length ? el('div', { class: 'card' }, historyTable(attempts)) : null,
    (store.sessions || []).length ? el('h2', { class: 'sec' }, 'Історія тренажера') : null,
    (store.sessions || []).length ? el('div', { class: 'card' }, sessionsTable(store.sessions.slice(-15).reverse())) : null,
    el('h2', { class: 'sec' }, 'Дані'),
    el('div', { class: 'card row small' },
      el('button', { class: 'btn small', onclick: exportProgress }, 'Експорт прогресу'),
      el('label', { class: 'btn small' }, 'Імпорт прогресу', el('input', { type: 'file', accept: 'application/json', class: 'hidden', onchange: importProgress })),

function startSim(variantId, saved) {

  setInProgress(state); saveStore();

    nav, body,

      el('button', { class: 'btn', onclick: () => go(idx - 1) }, '← Назад'),
      el('button', { class: 'btn danger', onclick: () => { const left = v.items.length - Object.keys(state.answers).length; if (confirm(left ? `Без відповіді: ${left}. Завершити?` : 'Завершити тест?')) finish(); } }, 'Завершити тест'),

    const it = v.items[idx];
    body.replaceChildren(renderItem(it, v.id, { selected: state.answers[it.n], onSelect: l => { state.answers[it.n] = l; persist(); go(idx, true); } }));
    renderNav(); persist();

  function finish() {
    stopTimer();
    const attempt = { variantId: v.id, date: new Date().toISOString(), seconds: EXAM_MINUTES * 60 - state.remaining, answers: state.answers, score: 0 };
    for (const it of v.items) {

// ---------- drill / errors ----------
function startDrill(variantSel, section, onlyNew) {
  let pool = variantSel === 'all' ? allItems()
    : variantSel.startsWith('kind:') ? allItems().filter(p => variantById(p.variantId).kind === variantSel.slice(5))
    : variantById(variantSel).items.map(item => ({ item, variantId: Number(variantSel) }));
  if (section !== 'all') pool = pool.filter(p => p.item.section === section);
  if (onlyNew) pool = pool.filter(p => !(store.drill[keyOf(p.variantId, p.item.n)] || {}).ok);
  if (!pool.length) { alert('Немає завдань за цим фільтром. Зніми галочку «лише ще не розв’язані».'); return; }
  runDrill(shuffleGrouped(pool), 'Тренажер', false);
}
function startErrors() {
  const pool = [];
  for (const k of Object.keys(store.errors)) {
    const [vid, n] = k.split(':').map(Number);
    const v = variantById(vid); const item = v && v.items.find(it => it.n === n);
    if (item) pool.push({ item, variantId: vid });
  }
  if (!pool.length) { home(); return; }
  runDrill(shuffleGrouped(pool), 'Робота над помилками', true);
}
// Keep items that share a passage adjacent (so the text is read once), shuffle the groups.
function shuffleGrouped(pool) {
  const groups = new Map();
  for (const p of pool) {
    const g = p.item.group ? `${p.variantId}:g${p.item.group}` : `${p.variantId}:${p.item.n}`;
    if (!groups.has(g)) groups.set(g, []);
    groups.get(g).push(p);
  }
  return shuffle([...groups.values()]).flatMap(g => g.sort((a, b) => a.item.n - b.item.n));
}

  let idx = 0, ok = 0, bad = 0;

  const scoreEl = el('span', { class: 'muted' });
  const body = el('div', {});
  const nextBtn = el('button', { class: 'btn primary', onclick: next }, 'Далі →');
  const backBtn = el('button', { class: 'btn', onclick: back }, '← Назад');
  const root = el('div', {},
    el('div', { class: 'qbar' }, counter, scoreEl, el('span', { class: 'spacer' }), el('button', { class: 'btn small', onclick: () => finishDrill() }, 'Завершити')),
    body,
    el('div', { class: 'qactions' }, backBtn, nextBtn));
  show(root);
  // One state per position, so going back shows the answer as it was given.
  const states = [];
  let cur = null;
  function render() {
    const { item, variantId } = pool[idx];
    counter.textContent = `${title} · ${idx + 1} / ${pool.length}`;
    scoreEl.textContent = `правильно ${ok} · помилок ${bad}`;
    cur = states[idx] || (states[idx] = { order: shuffle(item.answers.map(a => a.letter)), selected: null, revealed: false });
    body.replaceChildren(renderItem(item, variantId, {
      order: cur.order, selected: cur.selected, revealed: cur.revealed,
      showExplanation: cur.revealed && cur.selected !== item.correct,
      onSelect: l => {
        if (cur.revealed) return;

        const good = l === item.correct;
        good ? ok++ : bad++;
        results.push({ item, variantId, good, selected: l, order: cur.order });
        recordAnswer(item, variantId, good);

    backBtn.disabled = idx === 0;
  }

    show(el('div', {},
      el('div', { class: 'card' },
        el('h2', { style: 'margin-top:0' }, title + ' завершено'),

        bySection.length > 1 ? el('div', { class: 'bars' }, ...bySection.map(b => el('div', { class: 'bar' },
          el('span', {}, DATA.sections[b.sec]), el('b', {}, `${b.ok}/${b.total}`),
          el('div', { class: 'track' }, el('div', { class: 'fill', style: `width:${Math.round(100 * b.ok / b.total)}%` }))))) : null,
        wrong.length ? el('div', {},

          el('div', { class: 'list' },
            ...wrong.map((r, i) => el('button', { class: 'item link', onclick: () => reviewResults(wrong, i) },
              el('span', {}, el('b', {}, (oneVariant ? '' : shortTitle(variantById(r.variantId)) + ', ') + `завдання ${r.item.n}`), ' ', el('span', { class: 'muted' }, DATA.sections[r.item.section])),
              el('span', { class: 'answers2' },
                el('span', { class: 'pill bad' }, 'твоя: «' + answerText(r.item, r.selected) + '»'),
                el('span', { class: 'pill ok' }, 'правильно: «' + answerText(r.item, r.item.correct) + '»')))))) : el('p', { class: 'muted' }, 'Без помилок.')),
      el('div', { class: 'row', style: 'margin-top:14px' },
        Object.keys(store.errors).length ? el('button', { class: 'btn primary', onclick: startErrors }, 'Повторити помилки') : null,
        el('button', { class: 'btn', onclick: () => runDrill(shuffleGrouped(pool), title, isErrors) }, 'Пройти ще раз'),
        el('button', { class: 'btn', onclick: home }, 'На головну'))));
  }
  // Walk through answered items of this session with the given answer and the review open.
  function reviewResults(list, start) {
    let i = start;
    const body = el('div', {});
    const counter = el('b', {});
    const root = el('div', {},
      el('div', { class: 'qbar' }, counter, el('span', { class: 'spacer' }), el('button', { class: 'btn small', onclick: finishDrill }, 'До підсумку')),
      body,
      el('div', { class: 'qactions' },
        el('button', { class: 'btn', onclick: () => go(i - 1) }, '← Назад'),
        el('button', { class: 'btn primary', onclick: () => i + 1 < list.length ? go(i + 1) : finishDrill() }, 'Далі →')));
    show(root);
    function go(k) {
      i = Math.max(0, Math.min(list.length - 1, k));
      const r = list[i];
      counter.textContent = `Розбір помилки ${i + 1} / ${list.length}`;
      body.replaceChildren(renderItem(r.item, r.variantId, { order: r.order, selected: r.selected, revealed: true, showExplanation: true }));
      window.scrollTo({ top: 0 });
    }
    document.onkeydown = e => { if (e.key === 'ArrowRight' || e.key === 'Enter') { if (i + 1 < list.length) go(i + 1); else finishDrill(); } else if (e.key === 'ArrowLeft') go(i - 1); };
    go(i);
  }
  document.onkeydown = e => {
    if (['1', '2', '3', '4'].includes(e.key) && cur && !cur.revealed) { const btn = body.querySelectorAll('.ans')[+e.key - 1]; if (btn) btn.click(); }
    else if (e.key === 'ArrowRight' || e.key === 'Enter') { if (document.activeElement && document.activeElement.classList.contains('ans')) return; next(); }
    else if (e.key === 'ArrowLeft') back();
  };
  render();
}

// ---------- boot ----------
$('#homeBtn').addEventListener('click', () => {
  if (timerHandle && !confirm('Вийти? Прогрес симуляції збережеться, таймер зупиниться.')) return;
  document.onkeydown = null; home();
});
loadStore();
function boot() {
  const d = window.TZNK_DATA;
  if (!d) { app.replaceChildren(el('div', { class: 'card' }, 'Не знайдено data.js поруч з index.html. Запусти scrape.py, щоб згенерувати дані.')); return; }
  DATA = d;
  $('#subtitle').textContent = `ЄВІ · ${d.variants.length} варіантів · ${d.variants.reduce((s, v) => s + v.items.length, 0)} завдань · ${EXAM_MINUTES} хвилин на варіант`;
  home();
}
boot();
</script>
